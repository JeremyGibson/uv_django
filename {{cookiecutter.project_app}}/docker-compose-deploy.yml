include:
  - docker-compose.yml

services:
  memcached:
    image: memcached:1.6-alpine
    ports:
      - "11211:11211"
    command: memcached -m 64

  app:
    environment:
      DJANGO_SETTINGS_MODULE: {{ cookiecutter.project_app }}.settings.deploy
      DATABASE_URL: postgres://postgres@db:5432/{{ cookiecutter.project_app }}
      CACHE_URL: memcache://memcached:11211
      ENVIRONMENT: local
      DJANGO_SECRET_KEY: insecure-dev-key
      DOMAIN: localhost
      SESSION_COOKIE_SECURE: "False"
    build:
      context: .
      dockerfile: ./Dockerfile
      target: deploy
    command: ["uwsgi", "--show-config"]
    depends_on:
      - db
      - memcached
    ports:
      - "8000:8000"